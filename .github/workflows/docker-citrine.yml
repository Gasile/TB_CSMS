name: Build and Push CitrineOS Core

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'citrineos-core/**'

jobs:
  build-citrine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CitrineOS Core
        uses: docker/build-push-action@v5
        with:
          context: ./citrineos-core
          file: ./citrineos-core/apps/Server/deploy.Dockerfile
          push: true
          tags: ghcr.io/gasile/tb_csms-citrine:latest