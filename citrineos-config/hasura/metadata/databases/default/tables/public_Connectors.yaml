table:
  name: Connectors
  schema: public
object_relationships:
  - name: ChargingStation
    using:
      foreign_key_constraint_on: stationId
  - name: Evse
    using:
      foreign_key_constraint_on: evseId
  - name: Tariff
    using:
      foreign_key_constraint_on: tariffId
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
array_relationships:
  - name: StartTransactions
    using:
      foreign_key_constraint_on:
        column: connectorDatabaseId
        table:
          name: StartTransactions
          schema: public
  - name: Transactions
    using:
      foreign_key_constraint_on:
        column: connectorId
        table:
          name: Transactions
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        tenantId:
          _eq: x-hasura-tenant-id
      columns: '*'
    comment: ""
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
    comment: ""
update_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      check:
        tenantId:
          _eq: x-hasura-tenant-id
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
    comment: ""
event_triggers:
  - name: notify_connector_error
    definition:
      enable_manual: false
      update:
        columns:
          - errorCode
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: http://notification-service:8084/webhooks/notify
