table:
  name: MeterValues
  schema: public
object_relationships:
  - name: StopTransaction
    using:
      foreign_key_constraint_on: stopTransactionDatabaseId
  - name: Tariff
    using:
      foreign_key_constraint_on: tariffId
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: Transaction
    using:
      foreign_key_constraint_on: transactionDatabaseId
  - name: TransactionEvent
    using:
      foreign_key_constraint_on: transactionEventId
select_permissions:
  - role: user
    permission:
      columns:
        - sampledValue
        - timestamp
        - transactionDatabaseId
      filter:
        Transaction:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
    comment: ""
event_triggers:
  - name: track_metervalues
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: http://tb_csms-idle-service-1:8080/webhook
