table:
  name: OCPPMessages
  schema: public
object_relationships:
  - name: ChargingStation
    using:
      foreign_key_constraint_on: stationId
  - name: OCPPMessage
    using:
      foreign_key_constraint_on: requestMessageId
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
array_relationships:
  - name: OCPPMessages
    using:
      foreign_key_constraint_on:
        column: requestMessageId
        table:
          name: OCPPMessages
          schema: public
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
    comment: ""
event_triggers:
  - name: on_authorize_message
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: http://badge-service:8082/webhooks/authorize
