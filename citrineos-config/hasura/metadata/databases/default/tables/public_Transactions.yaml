table:
  name: Transactions
  schema: public
object_relationships:
  - name: Authorization
    using:
      foreign_key_constraint_on: authorizationId
  - name: ChargingStation
    using:
      foreign_key_constraint_on: stationId
  - name: Connector
    using:
      foreign_key_constraint_on: connectorId
  - name: Evse
    using:
      foreign_key_constraint_on: evseId
  - name: Location
    using:
      foreign_key_constraint_on: locationId
  - name: StartTransaction
    using:
      foreign_key_constraint_on:
        column: transactionDatabaseId
        table:
          name: StartTransactions
          schema: public
  - name: StopTransaction
    using:
      foreign_key_constraint_on:
        column: transactionDatabaseId
        table:
          name: StopTransactions
          schema: public
  - name: Tariff
    using:
      foreign_key_constraint_on: tariffId
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: User
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: ChargingNeeds
    using:
      foreign_key_constraint_on:
        column: transactionDatabaseId
        table:
          name: ChargingNeeds
          schema: public
  - name: ChargingProfiles
    using:
      foreign_key_constraint_on:
        column: transactionDatabaseId
        table:
          name: ChargingProfiles
          schema: public
  - name: MeterValues
    using:
      foreign_key_constraint_on:
        column: transactionDatabaseId
        table:
          name: MeterValues
          schema: public
  - name: TransactionEvents
    using:
      foreign_key_constraint_on:
        column: transactionDatabaseId
        table:
          name: TransactionEvents
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - allocated_limit
        - chargingState
        - connectorId
        - endTime
        - id
        - isActive
        - is_legal
        - ocppConnectionName
        - overtime_start_timestamp
        - startTime
        - stoppedReason
        - totalKwh
        - transactionId
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - isActive:
              _eq: true
      allow_aggregations: true
    comment: ""
event_triggers:
  - name: notify_idle_transaction
    definition:
      enable_manual: false
      update:
        columns:
          - is_legal
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: http://notification-service:8084/webhooks/notify
  - name: notify_wait_for_energy
    definition:
      enable_manual: false
      update:
        columns:
          - allocated_limit
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: http://notification-service:8084/webhooks/notify
  - name: smart_charging_transactions
    definition:
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns:
          - isActive
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: http://smart-charging-service:8081/webhooks/transactions
  - name: track_transactions
    definition:
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns:
          - isActive
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: http://tb_csms-idle-service-1:8080/webhook
