table:
  name: UserBadges
  schema: public
object_relationships:
  - name: Authorization
    using:
      foreign_key_constraint_on: authorization_id
  - name: User
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: x-hasura-user-id
      columns:
        - authorization_id
        - user_id
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - authorization_id
        - id
        - user_id
      filter:
        user_id:
          _eq: x-hasura-user-id
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: x-hasura-user-id
    comment: ""
