table:
  name: Users
  schema: public
array_relationships:
  - name: Transactions
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: Transactions
          schema: public
  - name: UserBadges
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: UserBadges
          schema: public
insert_permissions:
  - role: anonymous
    permission:
      check: {}
      columns:
        - email
        - first_name
        - last_name
        - password_hash
        - role
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - email
        - first_name
        - id
        - last_name
        - password_hash
        - role
      filter:
        id:
          _eq: x-hasura-user-id
    comment: ""
update_permissions:
  - role: anonymous
    permission:
      columns:
        - password_hash
        - reset_token
        - reset_token_expires
      filter:
        _or:
          - email:
              _eq: X-Hasura-User-Id
          - reset_token:
              _eq: X-Hasura-User-Id
      check: null
    comment: ""
  - role: user
    permission:
      columns:
        - email
        - first_name
        - last_name
        - password_hash
      filter:
        id:
          _eq: x-hasura-user-id
      check: null
    comment: ""
