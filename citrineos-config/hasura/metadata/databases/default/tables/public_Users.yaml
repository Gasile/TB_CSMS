table:
  name: Users
  schema: public
array_relationships:
  - name: Transactions
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: Transactions
          schema: public
  - name: UserBadges
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: UserBadges
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - email
        - first_name
        - id
        - last_name
        - password_hash
        - role
      filter:
        id:
          _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - email
        - first_name
        - last_name
        - password_hash
      filter:
        id:
          _eq: X-Hasura-User-Id
      check: null
    comment: ""
