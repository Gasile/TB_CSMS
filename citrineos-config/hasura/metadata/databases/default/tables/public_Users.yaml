table:
  name: Users
  schema: public
array_relationships:
  - name: Transactions
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: Transactions
          schema: public
  - name: UserBadges
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: UserBadges
          schema: public
insert_permissions:
  - role: anonymous
    permission:
      check: {}
      columns:
        - email
        - first_name
        - last_name
        - password_hash
        - role
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - admin_notifications
        - email
        - first_name
        - id
        - last_name
        - password_hash
        - role
        - user_notifications
      filter:
        id:
          _eq: x-hasura-user-id
    comment: ""
update_permissions:
  - role: anonymous
    permission:
      columns:
        - password_hash
        - reset_token
        - reset_token_expires
      filter:
        _or:
          - email:
              _eq: X-Hasura-User-Id
          - reset_token:
              _eq: X-Hasura-User-Id
      check: null
    comment: ""
  - role: user
    permission:
      columns:
        - admin_notifications
        - email
        - first_name
        - last_name
        - password_hash
        - user_notifications
      filter:
        id:
          _eq: x-hasura-user-id
      check: null
    comment: ""
event_triggers:
  - name: notify_password_reset
    definition:
      enable_manual: false
      update:
        columns:
          - reset_token
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: http://notification-service:8084/webhooks/notify
