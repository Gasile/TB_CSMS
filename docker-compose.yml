services:
  amqp-broker:
    image: rabbitmq:3-management
    ports:
      - 15672:15672
      - 5672:5672
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 10s
      timeout: 10s
      retries: 3

  ocpp-db:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    ports:
      - 5432:5432
    volumes:
      - ./data/postgresql/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test: "pg_isready --username=${POSTGRES_USER}"
      interval: 5s
      timeout: 10s
      retries: 5

  citrine:
    build:
      context: ./citrineos-core
      dockerfile: ./apps/Server/deploy.Dockerfile
    volumes:
      - ./citrineos-core/package-lock.json:/usr/local/apps/citrineos/package-lock-host.json
      - ./citrineos-core/package.json:/usr/local/apps/citrineos/package.json
      - ./citrineos-core/tsconfig.json:/usr/local/apps/citrineos/tsconfig.json
      - ./citrineos-core/tsconfig.build.json:/usr/local/apps/citrineos/tsconfig.build.json
      - ./citrineos-core/apps/Server:/usr/local/apps/citrineos/apps/Server
      - ./citrineos-core/packages/base:/usr/local/apps/citrineos/packages/base
      - ./citrineos-core/packages/core:/usr/local/apps/citrineos/packages/core
      - /usr/local/apps/citrineos/node_modules
      - /usr/local/apps/citrineos/apps/Server/node_modules
      - /usr/local/apps/citrineos/packages/base/node_modules
      - /usr/local/apps/citrineos/packages/core/node_modules
      - /usr/local/apps/citrineos/dist/
      - /usr/local/apps/citrineos/apps/Server/dist/
      - /usr/local/apps/citrineos/packages/base/dist/
      - /usr/local/apps/citrineos/packages/core/dist/
    environment:
      APP_NAME: "all"
      APP_ENV: "docker"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      DB_STRATEGY: "migrate"
      BOOTSTRAP_CITRINEOS_DATABASE_HOST: "ocpp-db"
      BOOTSTRAP_CITRINEOS_CONFIG_FILENAME: "config.json"
      BOOTSTRAP_CITRINEOS_FILE_ACCESS_TYPE: "local"
      BOOTSTRAP_CITRINEOS_FILE_ACCESS_LOCAL_DEFAULT_FILE_PATH: "/data"
      CONFIG_CITRINEOS_WIPE_FILE_ON_START: "true"
    depends_on:
      ocpp-db:
        condition: service_healthy
      amqp-broker:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - 8080:8080
      - 8081:8081
      - 8082:8082
      - 8083:8083
      - 8443:8443
      - 8444:8444
      - 9229:9229
    healthcheck:
      test: [
          "CMD-SHELL",
          "node -e \"const net = require(\\\"net\\\"); const client =
          net.createConnection(8080, \\\"127.0.0.1\\\", () => { client.end();
          process.exit(0); }); client.on(\\\"error\\\", () =>
          process.exit(1)); client.setTimeout(5000, () => { client.destroy();
          process.exit(1); });\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
      MINIO_SERVER_URL: http://localhost:9000
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " set -x

      echo 'Setting up MinIO alias' mc alias set myminio http://minio:9000
      ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} || echo 'FAILED: alias setup' "

  graphql-engine:
    image: hasura/graphql-engine:v2.40.3.cli-migrations-v3
    volumes:
      # C'est ici que s'opère la magie : Docker va lire tes fichiers de configuration !
      - ./citrineos-config/hasura/metadata:/hasura-metadata
      - ./citrineos-config/hasura/migrations:/hasura-migrations
    ports:
      - 8090:8080
    restart: always
    depends_on:
      citrine:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: "${HASURA_GRAPHQL_ADMIN_SECRET}"
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ocpp-db:5432/${POSTGRES_DB}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_METADATA_DEFAULTS:
        "{\"backend_configs\":{\"dataconnector\":{\"a\
        thena\":{\"uri\":\"http://data-connector-agent:8081/api/v1/athena\"},\"\
        mariadb\":{\"uri\":\"http://data-connector-agent:8081/api/v1/mariadb\"},\
        \"mysql8\":{\"uri\":\"http://data-connector-agent:8081/api/v1/mysql\"},\
        \"oracle\":{\"uri\":\"http://data-connector-agent:8081/api/v1/oracle\"},\
        \"snowflake\":{\"uri\":\"http://data-connector-agent:8081/api/v1/snowfl\
        ake\"}}}}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://graphql-engine:8080/healthz"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  idle-service:
    build:
      context: ./services/idle-service
    container_name: tb_csms-idle-service-1
    restart: always
    depends_on:
      graphql-engine:
        condition: service_healthy
    environment:
      - GRACE_PERIOD_MINUTES=2
      - HASURA_GRAPHQL_URL=http://graphql-engine:8080/v1/graphql
      - HASURA_GRAPHQL_ADMIN_SECRET=${HASURA_GRAPHQL_ADMIN_SECRET}
