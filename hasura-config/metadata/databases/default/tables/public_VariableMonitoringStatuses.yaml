table:
  name: VariableMonitoringStatuses
  schema: public
object_relationships:
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: VariableMonitoring
    using:
      foreign_key_constraint_on: variableMonitoringId
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
    comment: ""
